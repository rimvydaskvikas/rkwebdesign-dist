    <!-- Favicon'ai turi būti ir svetainės šaknyje (WordPress pusėje):
         Google ieškai reikia 48 px kartotinio ir nuskaitomo adreso. -->
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48x48.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050506" />
    <!-- Tema nustatoma prieš pirmą piešimą, kad nemirksėtų:
         URL ?tema=sviesi|tamsi turi pirmenybę, po to localStorage 'rkwd-tema'.
         Numatytoji - tamsi. -->
    <script>
      (function () {
        var t = null;
        try {
          var q = new URLSearchParams(location.search).get('tema');
          if (q === 'sviesi') t = 'light';
          else if (q === 'tamsi') t = 'dark';
          if (t) localStorage.setItem('rkwd-tema', t);
          else t = localStorage.getItem('rkwd-tema');
        } catch (e) {}
        if (t !== 'light') t = 'dark';
        document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#F7F5F0' : '#050506');
      })();
    </script>
